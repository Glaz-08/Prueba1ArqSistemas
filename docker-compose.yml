services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revisiones
      POSTGRES_PASSWORD: revisiones
      POSTGRES_DB: revisiones
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revisiones -d revisiones"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Registro de Revisiones
      APP_ENV: development
      API_PREFIX: /api
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://revisiones:revisiones@db:5432/revisiones
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
